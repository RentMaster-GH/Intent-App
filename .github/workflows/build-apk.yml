name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Auto-Bump App Version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const runNum = parseInt(process.env.RUN_NUMBER, 10);
            const baseVersion = (appJson.expo.version || "1.1.0").split(".").slice(0, 2).join(".");
            appJson.expo.version = `${baseVersion}.${runNum}`;
            appJson.expo.android = appJson.expo.android || {};
            appJson.expo.android.versionCode = runNum;
            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2) + "\n");
            console.log(`Bumped version to ${appJson.expo.version} (versionCode: ${runNum})`);
          '

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Decode Keystore and Configure Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/intent-release.keystore
          node -e '
            const fs = require("fs");
            const props = [
              "storeFile=intent-release.keystore",
              `storePassword=${process.env.STORE_PASSWORD}`,
              `keyAlias=${process.env.KEY_ALIAS}`,
              `keyPassword=${process.env.KEY_PASSWORD}`
            ].join("\n") + "\n";
            fs.writeFileSync("android/keystore.properties", props);

            let gradle = fs.readFileSync("android/app/build.gradle", "utf8");
            const propsHeader = `def keystorePropertiesFile = rootProject.file("keystore.properties")\ndef keystoreProperties = new Properties()\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\nandroid {`;
            gradle = gradle.replace("android {", propsHeader);

            const releaseSigning = `signingConfigs {\n        debug {\n            storeFile file(\x27debug.keystore\x27)\n            storePassword \x27android\x27\n            keyAlias \x27androiddebugkey\x27\n            keyPassword \x27android\x27\n        }\n        release {\n            if (keystorePropertiesFile.exists()) {\n                storeFile file(keystoreProperties[\x27storeFile\x27])\n                storePassword keystoreProperties[\x27storePassword\x27]\n                keyAlias keystoreProperties[\x27keyAlias\x27]\n                keyPassword keystoreProperties[\x27keyPassword\x27]\n            }\n        }`;
            gradle = gradle.replace(/signingConfigs\s*\{[\s\S]*?keyPassword\s*[\x27"]android[\x27"]\s*\}/, releaseSigning);
            gradle = gradle.replace(/(release\s*\{[\s\S]*?)signingConfig\s+signingConfigs\.debug/, "$1signingConfig signingConfigs.release");
            fs.writeFileSync("android/app/build.gradle", gradle);
          '

      - name: Build Optimized Signed APK
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          EXPO_PUBLIC_SUPABASE_URL: https://supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          CI: true
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true \
            -Pexpo.useLegacyPackaging=true

      - name: Verify APK Signature
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk intent-release.apk
          ls -lh intent-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: intent-release-apk
          path: intent-release.apk
          retention-days: 30
